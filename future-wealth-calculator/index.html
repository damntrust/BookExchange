<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I want to know my future wealth</title>
  <style>
    :root {
      --accent: #0a2a66; /* dark blue */
      --accent-700: #0e3a8a;
      --accent-600: #1552c2;
      --bg: #ffffff; /* white dominant */
      --text: #0b1320; /* near-black on white */
      --muted: #6b7280;
      --border: #e5e7eb;
      --card: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
        Cantarell, Noto Sans, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;
      color: var(--text);
      background: var(--bg);
    }

    .wrap {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 24px 16px;
      background: linear-gradient(180deg, #0b2b6b 0%, #0a2a66 100%);
      color: white;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .title {
      margin: 0;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    main { padding: 28px 0 56px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 880px) {
      .grid { grid-template-columns: 1.1fr 0.9fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 2px 8px rgba(16, 24, 40, 0.06);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: var(--accent);
    }

    .helper {
      margin: 0 0 6px;
      font-size: 13px;
      color: var(--muted);
    }

    form { display: grid; gap: 14px; }

    .field { display: grid; gap: 6px; }
    label { font-weight: 600; font-size: 14px; }

    .input {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }
    .input input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text);
      background: transparent;
    }
    .input .suffix { color: var(--muted); font-size: 14px; }

    .actions { display: flex; gap: 10px; padding-top: 4px; }

    .btn {
      appearance: none;
      border: 1px solid transparent;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.3px;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .2s ease, transform .02s ease, box-shadow .2s ease;
      box-shadow: 0 1px 2px rgba(10, 42, 102, 0.2);
    }
    .btn:hover { background: var(--accent-700); }
    .btn:active { transform: translateY(1px); }

    .btn.secondary {
      background: #ffffff;
      color: var(--accent);
      border-color: var(--accent);
    }
    .btn.secondary:hover {
      background: #f8fafc;
    }

    .result {
      display: none;
      border: 1px dashed var(--accent-600);
      border-radius: 12px;
      padding: 14px;
      background: #ffffff;
    }

    .result.visible { display: block; }

    .result p { margin: 0; font-size: 16px; }
    .result .value { color: var(--accent-700); font-weight: 800; }

    footer {
      padding: 20px 16px;
      color: #475569;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="container">
        <h1 class="title">I want to know my future wealth</h1>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="grid">
          <section class="card">
            <h2>Inputs</h2>
            <p class="helper">Use white-dominant theme with dark blue accents.</p>
            <form id="calc-form" autocomplete="off">
              <div class="field">
                <label for="currentPortfolio">My current Portfolio value</label>
                <div class="input">
                  <input id="currentPortfolio" name="currentPortfolio" type="number" min="0" step="1" placeholder="e.g., 2500000" required />
                </div>
              </div>

              <div class="field">
                <label for="yearlyLumpsum">Lumpsum Investment Every Year</label>
                <div class="input">
                  <input id="yearlyLumpsum" name="yearlyLumpsum" type="number" min="0" step="1" placeholder="e.g., 300000" required />
                </div>
              </div>

              <div class="field">
                <label for="monthlySip">Current Monthly SIP</label>
                <div class="input">
                  <input id="monthlySip" name="monthlySip" type="number" min="0" step="1" placeholder="e.g., 20000" required />
                  <span class="suffix">per month</span>
                </div>
              </div>

              <div class="field">
                <label for="annualReturn">Assumed portfolio value % (annual)</label>
                <div class="input">
                  <input id="annualReturn" name="annualReturn" type="number" min="0" step="0.01" placeholder="e.g., 13" required />
                  <span class="suffix">%</span>
                </div>
              </div>

              <div class="field">
                <label for="years">Portfolio value after (years)</label>
                <div class="input">
                  <input id="years" name="years" type="number" min="1" step="1" placeholder="e.g., 20" required />
                  <span class="suffix">years</span>
                </div>
              </div>

              <div class="actions">
                <button class="btn" type="submit">Calculate</button>
                <button class="btn secondary" type="button" id="resetBtn">Reset</button>
              </div>
            </form>
          </section>

          <section class="card">
            <h2>Result</h2>
            <div id="result" class="result" aria-live="polite"></div>
          </section>
        </div>
      </div>
    </main>

    <footer class="container">
      Made with a white-first design and dark blue highlights.
    </footer>
  </div>

  <script>
    function formatCurrency(number) {
      try {
        return new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }).format(Math.round(number));
      } catch (e) {
        return String(Math.round(number));
      }
    }

    function computeFutureWealth({ currentPortfolio, yearlyLumpsum, monthlySip, annualReturnPct, years }) {
      const r = annualReturnPct / 100;        // annual rate as decimal
      const months = years * 12;
      const rm = r / 12;                      // simple monthly rate

      // 1) Current portfolio compounded annually
      const futureOfCurrent = currentPortfolio * Math.pow(1 + r, years);

      // 2) Yearly lumpsum: treat as paid around mid-year on average
      //    Standard future value of an ordinary annuity times (1+r)^(0.5) timing factor.
      const fvAnnuityOrdinary = yearlyLumpsum * ((Math.pow(1 + r, years) - 1) / r);
      const fvLumpsum = fvAnnuityOrdinary * Math.pow(1 + r, 0.5);

      // 3) Monthly SIP compounded monthly with simple monthly rate
      const fvSip = monthlySip * ((Math.pow(1 + rm, months) - 1) / rm);

      return futureOfCurrent + fvLumpsum + fvSip;
    }

    const form = document.getElementById('calc-form');
    const resultEl = document.getElementById('result');
    const resetBtn = document.getElementById('resetBtn');

    function hideResult() {
      resultEl.classList.remove('visible');
      resultEl.innerHTML = '';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const currentPortfolio = Number(document.getElementById('currentPortfolio').value || 0);
      const yearlyLumpsum = Number(document.getElementById('yearlyLumpsum').value || 0);
      const monthlySip = Number(document.getElementById('monthlySip').value || 0);
      const annualReturnPct = Number(document.getElementById('annualReturn').value || 0);
      const years = Number(document.getElementById('years').value || 0);

      if (years <= 0) { hideResult(); return; }

      const total = computeFutureWealth({ currentPortfolio, yearlyLumpsum, monthlySip, annualReturnPct, years });
      const formatted = formatCurrency(total);
      resultEl.innerHTML = `<p>Your wealth will be <span class="value">${formatted}</span> after <strong>${years}</strong> years.</p>`;
      resultEl.classList.add('visible');
    });

    resetBtn.addEventListener('click', () => {
      form.reset();
      hideResult();
    });
  </script>
</body>
</html>
